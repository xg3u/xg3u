<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="title desc">
<title id="title">Meshal Alshammari — Software Developer, Digital Solutions Creator</title>
<desc id="desc">Animated header for the xg3u GitHub profile: name, typed role titles and gold geometric lines on a dark background.</desc>
<defs>
  <clipPath id="frame"><rect width="1000" height="540" rx="24"/></clipPath>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F5F5F5" stroke-opacity=".045"/></pattern>
  <radialGradient id="fade" cx=".5" cy=".46" r=".62"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gridMask"><rect width="1000" height="540" fill="url(#fade)"/></mask>
  <radialGradient id="glow" cx=".5" cy=".44" r=".5"><stop offset="0" stop-color="#D6B36A" stop-opacity=".20"/><stop offset=".55" stop-color="#D6B36A" stop-opacity=".05"/><stop offset="1" stop-color="#D6B36A" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#B8944F"/><stop offset=".5" stop-color="#E8D5A3"/><stop offset="1" stop-color="#B8944F"/></linearGradient>
  <linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#D6B36A" stop-opacity="0"/><stop offset=".5" stop-color="#D6B36A"/><stop offset="1" stop-color="#D6B36A" stop-opacity="0"/></linearGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#FFF6DD" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="nameClip"><text x="500" y="292" text-anchor="middle" textLength="840" lengthAdjust="spacingAndGlyphs" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="82" font-weight="700">MESHAL ALSHAMMARI</text></clipPath>
</defs>
<style>
  .ch{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:34px;text-anchor:middle;fill:#E8D5A3;animation:type .16s ease-out both}
  .l1{fill:#F5F5F5;fill-opacity:.82}
  @keyframes type{from{opacity:0}to{opacity:1}}
  .rise{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) .2s both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .fadein{animation:fadein 1.6s ease .1s both}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .rule{transform-box:fill-box;transform-origin:center;animation:draw 1.2s cubic-bezier(.2,.7,.2,1) 1s both}
  @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .sheen{animation:sheen 7s ease-in-out 2.2s infinite both}
  @keyframes sheen{0%{transform:translateX(-420px)}35%,100%{transform:translateX(1180px)}}
  @keyframes move0{to{transform:translateX(367.2px)}}@keyframes move1{to{transform:translateX(510.0px)}}
  @keyframes appear{from{opacity:0}to{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes hide{to{opacity:0}}
  .breathe{animation:breathe 7s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
  .flow{animation:flow 30s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-280}}
  .trace{fill:none;stroke:#D6B36A;stroke-opacity:.22;stroke-width:1.5}
  .pulse{fill:none;stroke:#E8D5A3;stroke-width:2;stroke-linecap:round;stroke-dasharray:36 900;animation:pulse 6s linear infinite}
  @keyframes pulse{from{stroke-dashoffset:36}to{stroke-dashoffset:-560}}
  .node{fill:#0B0F14;stroke:#D6B36A;stroke-opacity:.55;stroke-width:1.5}
  .mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.sheen{display:none}}
</style>
<g clip-path="url(#frame)">
  <rect width="1000" height="540" fill="#0B0F14"/>
  <rect width="1000" height="540" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1000" height="540" fill="url(#glow)" class="breathe"/>

  <!-- rotating geometric hexagons -->
  <g fill="none" stroke="#D6B36A">
    <path d="M500 20 716.5 145v250L500 520 283.5 395V145Z" stroke-opacity=".10" stroke-width="1.2"/>
    <path d="M500 70 673.2 170v200L500 470 326.8 370V170Z" stroke-opacity=".06" stroke-width="1" stroke-dasharray="4 10" class="flow"/>
  </g>

  <!-- circuit traces with travelling light -->
  <g>
    <path class="trace" d="M0 130H96l40-40h126"/>
    <path class="pulse" d="M0 130H96l40-40h126"/>
    <path class="trace" d="M0 410h70l44 44h150"/>
    <path class="pulse" style="animation-delay:-2.2s" d="M0 410h70l44 44h150"/>
    <path class="trace" d="M1000 112H900l-36 36H740"/>
    <path class="pulse" style="animation-delay:-3.6s" d="M1000 112H900l-36 36H740"/>
    <path class="trace" d="M1000 428H912l-40-40H748"/>
    <path class="pulse" style="animation-delay:-1.1s" d="M1000 428H912l-40-40H748"/>
    <circle class="node" cx="262" cy="90" r="4"/><circle class="node" cx="264" cy="454" r="4"/>
    <circle class="node" cx="740" cy="148" r="4"/><circle class="node" cx="748" cy="388" r="4"/>
  </g>

  <!-- code glyphs -->
  <g class="mono" fill="#9CA3AF" fill-opacity=".22" font-size="18">
    <text x="150" y="196">{ }</text><text x="812" y="200">&lt;/&gt;</text>
    <text x="150" y="330">0x3u</text><text x="818" y="324">=&gt;</text>
  </g>

  <!-- corner frame -->
  <g fill="none" stroke="#D6B36A" stroke-opacity=".55" stroke-width="2" stroke-linecap="round">
    <path d="M28 64V28h36M936 28h36v36M972 476v36h-36M64 512H28v-36"/>
  </g>

  <!-- top bar -->
  <g class="fadein">
    <g transform="translate(52 50) scale(.25)">
      <path d="M64 6 114.2 35v58L64 122 13.8 93V35Z" fill="#0B0F14" stroke="#D6B36A" stroke-width="5"/>
      <g fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M41 43 58 64 41 85" stroke="#D6B36A"/><path d="M87 43 70 64 87 85" stroke="#F5F5F5"/></g>
    </g>
    <text x="96" y="76" class="mono" font-size="20" fill="#E8D5A3" letter-spacing="2">xg3u</text>
    <text x="948" y="78" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" fill="#E8D5A3" fill-opacity=".85">مشعل فارس الشمري</text>
  </g>

  <!-- name -->
  <g class="rise">
    <text x="500" y="196" text-anchor="middle" class="mono" font-size="18" fill="#9CA3AF" letter-spacing="8">— HELLO, I AM —</text>
    <text x="500" y="292" text-anchor="middle" textLength="840" lengthAdjust="spacingAndGlyphs" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="82" font-weight="700" fill="#F5F5F5">MESHAL ALSHAMMARI</text>
    <g clip-path="url(#nameClip)"><rect class="sheen" x="0" y="200" width="160" height="110" fill="url(#sheen)" opacity=".55"/></g>
  </g>

  <!-- gold rule with diamond -->
  <g class="rule">
    <rect x="300" y="318" width="400" height="1.5" fill="url(#rule)"/>
    <path d="M500 312l7 7-7 7-7-7Z" fill="#D6B36A"/>
  </g>

  <!-- typed role titles -->
  <text x="326.6" y="368" class="ch l0" style="animation-delay:1.900s">S</text><text x="347.0" y="368" class="ch l0" style="animation-delay:1.955s">O</text><text x="367.4" y="368" class="ch l0" style="animation-delay:2.010s">F</text><text x="387.8" y="368" class="ch l0" style="animation-delay:2.065s">T</text><text x="408.2" y="368" class="ch l0" style="animation-delay:2.120s">W</text><text x="428.6" y="368" class="ch l0" style="animation-delay:2.175s">A</text><text x="449.0" y="368" class="ch l0" style="animation-delay:2.230s">R</text><text x="469.4" y="368" class="ch l0" style="animation-delay:2.285s">E</text><text x="510.2" y="368" class="ch l0" style="animation-delay:2.395s">D</text><text x="530.6" y="368" class="ch l0" style="animation-delay:2.450s">E</text><text x="551.0" y="368" class="ch l0" style="animation-delay:2.505s">V</text><text x="571.4" y="368" class="ch l0" style="animation-delay:2.560s">E</text><text x="591.8" y="368" class="ch l0" style="animation-delay:2.615s">L</text><text x="612.2" y="368" class="ch l0" style="animation-delay:2.670s">O</text><text x="632.6" y="368" class="ch l0" style="animation-delay:2.725s">P</text><text x="653.0" y="368" class="ch l0" style="animation-delay:2.780s">E</text><text x="673.4" y="368" class="ch l0" style="animation-delay:2.835s">R</text><text x="255.2" y="418" class="ch l1" style="animation-delay:3.300s">D</text><text x="275.6" y="418" class="ch l1" style="animation-delay:3.355s">I</text><text x="296.0" y="418" class="ch l1" style="animation-delay:3.410s">G</text><text x="316.4" y="418" class="ch l1" style="animation-delay:3.465s">I</text><text x="336.8" y="418" class="ch l1" style="animation-delay:3.520s">T</text><text x="357.2" y="418" class="ch l1" style="animation-delay:3.575s">A</text><text x="377.6" y="418" class="ch l1" style="animation-delay:3.630s">L</text><text x="418.4" y="418" class="ch l1" style="animation-delay:3.740s">S</text><text x="438.8" y="418" class="ch l1" style="animation-delay:3.795s">O</text><text x="459.2" y="418" class="ch l1" style="animation-delay:3.850s">L</text><text x="479.6" y="418" class="ch l1" style="animation-delay:3.905s">U</text><text x="500.0" y="418" class="ch l1" style="animation-delay:3.960s">T</text><text x="520.4" y="418" class="ch l1" style="animation-delay:4.015s">I</text><text x="540.8" y="418" class="ch l1" style="animation-delay:4.070s">O</text><text x="561.2" y="418" class="ch l1" style="animation-delay:4.125s">N</text><text x="581.6" y="418" class="ch l1" style="animation-delay:4.180s">S</text><text x="622.4" y="418" class="ch l1" style="animation-delay:4.290s">C</text><text x="642.8" y="418" class="ch l1" style="animation-delay:4.345s">R</text><text x="663.2" y="418" class="ch l1" style="animation-delay:4.400s">E</text><text x="683.6" y="418" class="ch l1" style="animation-delay:4.455s">A</text><text x="704.0" y="418" class="ch l1" style="animation-delay:4.510s">T</text><text x="724.4" y="418" class="ch l1" style="animation-delay:4.565s">O</text><text x="744.8" y="418" class="ch l1" style="animation-delay:4.620s">R</text>
<rect x="315.4" y="340" width="3" height="34" fill="#D6B36A" style="animation:hide .2s linear 3.2s both,move0 0.990s steps(18,jump-start) 1.9s both"/><rect x="244.0" y="390" width="3" height="34" fill="#D6B36A" style="animation:appear .1s linear 3.3s both,blink 1.1s linear 4.8s infinite,move1 1.375s steps(25,jump-start) 3.3s both"/>

  <!-- footer line -->
  <g class="fadein mono" font-size="16" fill="#9CA3AF" letter-spacing="2">
    <text x="64" y="500">// BSc COMPUTER SCIENCE</text>
    <text x="936" y="500" text-anchor="end">github.com/xg3u</text>
  </g>
</g>
<rect x=".75" y=".75" width="998.5" height="538.5" rx="23.5" fill="none" stroke="#D6B36A" stroke-opacity=".22" stroke-width="1.5"/>
</svg>
