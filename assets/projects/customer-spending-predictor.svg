<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t">
<title id="t">Customer Spending Predictor — bilingual Streamlit app that scores customer value</title>
<defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8D5A3"/><stop offset="1" stop-color="#B8944F"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151B23"/><stop offset="1" stop-color="#0B0F14"/></linearGradient>
<radialGradient id="glow" cx=".76" cy=".5" r=".45"><stop offset="0" stop-color="#D6B36A" stop-opacity=".14"/><stop offset="1" stop-color="#D6B36A" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#F5F5F5" fill-opacity=".06"/></pattern>
<clipPath id="c"><rect width="1000" height="400" rx="24"/></clipPath>
