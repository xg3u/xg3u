<style>.gauge{stroke-dasharray:100;animation:g 2s cubic-bezier(.2,.7,.2,1) .3s both}@keyframes g{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.bar{transform-box:fill-box;transform-origin:left;animation:b 1.2s cubic-bezier(.2,.7,.2,1) both}@keyframes b{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
